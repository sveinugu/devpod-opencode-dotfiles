apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotfiles-workspace
  labels:
    app.kubernetes.io/name: dotfiles-workspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dotfiles-workspace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dotfiles-workspace
    spec:
      containers:
        - name: workspace
          image: devspace-bare-hub:task1-20260524
          imagePullPolicy: IfNotPresent
          workingDir: /workspaces/dotfiles/main
          command:
            - sh
            - -lc
            - sleep infinity
          env:
            - name: HUB_NONO_PROVIDER_SECRET_DIR
              value: /var/run/secrets/nono/providers
            - name: HUB_NONO_SECRET_HELPER_SUDO
              value: sudo -n
            - name: HUB_NONO_AGENT_USER
              value: agent
          volumeMounts:
            - name: workspace-storage
              mountPath: /workspaces/dotfiles
              subPath: workspace-root
            - name: workspace-storage
              mountPath: /home/vscode
              subPath: home-vscode
            - name: workspace-storage
              mountPath: /home/agent
              subPath: home-agent
            - name: nono-provider-secrets
              mountPath: /var/run/secrets/nono/providers
              readOnly: true
      initContainers:
        - name: init-home-agent-permissions
          image: devspace-bare-hub:task1-20260524
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -lc
            - |
              mkdir -p /workspace-storage/home-agent/.config /workspace-storage/home-agent/.cache /workspace-storage/home-agent/.local/share /workspace-storage/home-agent/.local/state/nono /workspace-storage/home-agent/.local/state/opencode
              chown -R agent:agent /workspace-storage/home-agent
              chmod 0700 /workspace-storage/home-agent
          volumeMounts:
            - name: workspace-storage
              mountPath: /workspace-storage
      volumes:
        - name: workspace-storage
          persistentVolumeClaim:
            claimName: dotfiles-workspace
        - name: nono-provider-secrets
          secret:
            secretName: dotfiles-nono-provider-credentials
            defaultMode: 0400
